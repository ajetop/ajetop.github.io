---
layout: default
---
<section class="section">
  <a href="{{ '/koleksi/' | relative_url }}" class="link-more">← Kembali ke Koleksi</a>
  <article class="card" style="margin-top:10px">
    <div class="thumb" style="height:160px;border-radius:16px;background:linear-gradient(135deg,#F59E0B,#EF4444)"></div>
    <div style="margin-top:14px">
      <span class="cat">{{ page.cat | default: "item" }}</span>
      <h1 style="margin:6px 0 8px;font-size:26px;letter-spacing:-.03em;line-height:1.15">{{ page.title }}</h1>
      {% if page.desc %}<p class="muted">{{ page.desc }}</p>{% endif %}
      <div class="prose">{{ content }}</div>
      <div style="margin-top:18px;display:flex;gap:8px">
        <a href="{{ '/koleksi/' | relative_url }}" class="btn ghost">← Koleksi</a>
        <a href="{{ '/' | relative_url }}" class="btn primary">Ke Beranda</a>
      </div>
    </div>
  </article>
</section>
