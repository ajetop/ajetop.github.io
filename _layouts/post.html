---
layout: default
---
<section class="section">
  <a href="{{ '/' | relative_url }}#blog" class="link-more">← Kembali ke Blog</a>
  <article class="card" style="margin-top:10px">
    <div class="thumb" style="height:160px;border-radius:16px;background:linear-gradient(135deg,#6C5CE7,#06B6D4)"></div>
    <div style="margin-top:14px">
      <span class="cat">{{ page.date | date: "%Y-%m-%d" }} • {{ page.categories | first | default: "post" }}</span>
      <h1 style="margin:6px 0 8px;font-size:26px;letter-spacing:-.03em;line-height:1.15">{{ page.title }}</h1>
      {% if page.excerpt %}<p class="muted" style="margin-top:6px">{{ page.excerpt }}</p>{% endif %}
      <div class="prose">
        {{ content }}
      </div>
      <div style="margin-top:18px;display:flex;gap:8px">
        <a href="{{ '/' | relative_url }}#blog" class="btn ghost">← Blog</a>
        <a href="{{ '/' | relative_url }}" class="btn primary">Ke Beranda</a>
      </div>
    </div>
  </article>
</section>
