---
layout: default
---
<section class="section">
  <a href="{{ '/karya/' | relative_url }}" class="link-more">← Kembali ke Karya</a>
  <article class="card" style="margin-top:10px">
    <div class="thumb t{{ page.thumb | default: 1 }}" style="height:180px;border-radius:16px"></div>
    <div style="margin-top:14px">
      <span class="cat">{{ page.cat | default: "post" }} • {{ page.year | default: "—" }}</span>
      <h1 style="margin:6px 0 8px;font-size:26px;letter-spacing:-.03em;line-height:1.15">{{ page.title }}</h1>
      {% if page.desc %}<p class="muted">{{ page.desc }}</p>{% endif %}
      <div class="prose">{{ content }}</div>
      <div style="margin-top:18px;display:flex;gap:8px">
        <a href="{{ '/karya/' | relative_url }}" class="btn ghost">← Karya</a>
        <a href="{{ '/' | relative_url }}#kontak" class="btn primary">Hubungi</a>
      </div>
    </div>
  </article>
</section>
