title: "Teja Sukakemana"
description: "Portfolio dan portal profil modern dengan nuansa mobile-app — karya, blog, dan koleksi."
url: "https://ajetop.github.io"
baseurl: ""
lang: id-ID

author:
  name: "Teja Sukakemana"
  role: "Product Designer & Frontend Developer"
  location: "Jakarta, ID"
  email: "tejanyadia@email.com"
  url: "https://kohardsi.github.io"
  twitter: "teja_7x"

logo: /assets/img/og-default.jpg
image: /assets/img/og-default.jpg
twitter:
  username: Teja_7x

social:
  name: "Teja Sukakemana"
  links:
    - https://github.com/kohardsi
    - https://linkedin.com/in/teja-sukmana

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /blog/:title/

collections:
  karya:
    output: true
    permalink: /karya/:slug/
  koleksi:
    output: true
    permalink: /koleksi/:slug/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "karya"
    values:
      layout: karya
      image: /assets/img/og-default.jpg
  - scope:
      path: ""
      type: "koleksi"
    values:
      layout: koleksi
      image: /assets/img/og-default.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      image: /assets/img/og-default.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - data
  - js
  - script.js
  - style.css
  - "*.gemspec"

sass:
  style: compressed
