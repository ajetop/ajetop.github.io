<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="author" content="{{ site.author.name }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% if page.extra_css %}
  {% for css in page.extra_css %}
    <link rel="stylesheet" href="{{ css }}">
  {% endfor %}
{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% seo %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="alternate" type="application/json" title="{{ site.title | escape }} JSON" href="{{ '/feed.json' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
{% include schema.html %}
