<div class="card contact-card">
  <div class="contact-info">
    <a class="c-item" href="mailto:{{ site.data.site.kontak.email }}">
      <i>✉</i> {{ site.data.site.kontak.email }}
    </a>
    <a class="c-item" href="https://{{ site.data.site.kontak.whatsapp }}" target="_blank" rel="noopener">
      <i>◷</i> {{ site.data.site.kontak.whatsapp }}
    </a>
    <a class="c-item" href="#">
      <i>◎</i> {{ site.data.site.kontak.location }}
    </a>
  </div>
  <form id="form">
    <label> Nama <input required name="name" placeholder="Nama kamu" autocomplete="name">
    </label>
    <label> Email <input required type="email" name="email" placeholder="email@contoh.com" autocomplete="email">
    </label>
    <label> Pesan <textarea required name="msg" rows="4" placeholder="Ceritakan kebutuhan..."></textarea>
    </label>
    <button class="btn primary full" type="submit"> Kirim Pesan </button>
    <p class="form-note">Pesan akan dikirim melalui WhatsApp.</p>
  </form>
</div>

<script>
document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();

  const form = e.target;
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const msg = form.msg.value.trim();

  if (!name || !email || !msg) {
    alert('Mohon lengkapi semua data terlebih dahulu.');
    return;
  }

  const phone = '{{ site.data.site.kontak.whatsapp }}'
    .replace('wa.me/', '')
    .replace(/\D/g, '');

  const text =
`Halo Teja,

Nama: ${name}
Email: ${email}

Pesan:
${msg}`;

  const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

  window.open(whatsappUrl, '_blank');
});
</script>
